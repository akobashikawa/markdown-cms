<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub CMS</title>
    <link rel="stylesheet" href="https://matcha.mizu.sh/matcha.css">
    <style>
        /* Login box styles */
        .login-box {
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 24px;
            margin: 20px 0;
            text-align: center;
        }
        
        .login-box h2 {
            margin-top: 0;
            color: #1f2328;
        }
        
        .login-box .error {
            color: #cf222e;
            display: block;
            margin-top: 8px;
        }
        
        .login-box a {
            color: #0969da;
            text-decoration: none;
        }
        
        .login-box a:hover {
            text-decoration: underline;
        }
        
        .login-box .login-steps {
            text-align: left;
            max-width: 560px;
            margin: 16px auto;
        }
        
        .login-box .login-steps li {
            margin-bottom: 8px;
        }
        
        /* Repository access is a manual step: GitHub cannot prefill it. */
        .login-box .login-steps li.step-emphasis {
            background: #fff8c5;
            border: 1px solid #d4a72c;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }
        
        .login-box .copy-row {
            display: block;
            margin-top: 6px;
        }
        
        .login-box .step-hint {
            display: block;
            color: #656d76;
            font-size: 13px;
            margin-top: 6px;
        }
        
        .login-box .form-control {
            max-width: 560px;
            margin: 0 auto;
            display: block;
        }
        
        .login-box .login-note {
            color: #656d76;
            font-size: 13px;
            margin: 12px auto 0;
            max-width: 560px;
        }
        
        .user-badge {
            color: #656d76;
        }
        
        .edit-form textarea.form-control {
            width: 100%;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }
        
        /* Actions look like links but are buttons (avoids "#" navigation) */
        .link-button {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: #0969da;
            cursor: pointer;
        }
        
        .link-button:hover {
            text-decoration: underline;
        }
        
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #d0d7de;
            text-align: center;
            color: #656d76;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script type="importmap">
        { "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
          "vue-router": "https://unpkg.com/vue-router@4/dist/vue-router.esm-browser.js",
          "axios": "https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/esm/axios.min.js",
          "marked": "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js",
          "@vue/devtools-api": "https://unpkg.com/@vue/devtools-api@6.5.1/lib/esm/index.js"
        } }
    </script>
    <script src="./js/main.js" type="module"></script>
</body>
</html>
